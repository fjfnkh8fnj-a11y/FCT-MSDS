function qualifies(c,e){if(c.plant!=='전체'&&e.plant!==c.plant)return false;if(c.targetMode==='개인별')return (c.targetIds||[]).includes(e.id);if(c.targetMode==='부서별')return (c.targetDepts||[]).includes(e.dept);return true}

function normalizeQuiz(c){let q=c.quiz||{};if(!Array.isArray(q.questions))q.questions=q.question?[{id:'qm_'+c.id,question:q.question,choices:q.choices||['O','X'],answer:q.answer??0,type:'multiple',explanation:''}]:[];q.questions=q.questions.map((it,i)=>({id:it.id||'qm_'+c.id+'_'+i,question:String(it.question||''),choices:Array.isArray(it.choices)?it.choices:[],answer:Number(it.answer??0),type:it.type||'multiple',explanation:it.explanation||''}));q.passingScore=Number.isFinite(+q.passingScore)?Math.max(0,Math.min(100,+q.passingScore)):80;q.questionCount=Math.max(1,Math.round(+q.questionCount||Math.min(5,q.questions.length||1)));q.attemptLimit=Math.max(0,Math.round(+q.attemptLimit||3));q.shuffle=q.shuffle!==false;q.published=q.published!==false;q.version=Math.max(1,+q.version||1);c.quiz=q;c.minWatchMinutes=Math.max(0,Math.round(c.minWatchMinutes===undefined||c.minWatchMinutes===null?(c.videos?.length?Math.min(c.duration||60,60):0):Number(c.minWatchMinutes)||0));return c}

function videoId(str){let s=String(str||'').trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;try{let u=new URL(s);if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname)){let v=u.searchParams.get('v');if(v&&/^[A-Za-z0-9_-]{11}$/.test(v))return v;let x=u.pathname.match(/^\/(?:shorts|live|embed)\/([\w-]{11})/);if(x)return x[1]}if(['youtu.be','www.youtu.be'].includes(u.hostname)){let v=u.pathname.slice(1).split('/')[0];return /^[\w-]{11}$/.test(v)?v:null}}catch(e){}return null}

function render(){document.body.classList.toggle('employee-mode',state.role==='employee');let c=course();if(c)state.courseId=c.id;$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===state.page));$$('[data-role]').forEach(x=>x.classList.toggle('active',x.dataset.role===state.role));$('#pageEyebrow').textContent=state.role==='admin'?'FCT / 관리자':'FCT / 직원교육';$('#pageTitle').textContent=({records:'교육별 이수 현황',quiz:'평가문제 관리',staff:'직원명부',learn:'직원 교육 화면',overview:'교육 운영 대시보드'})[state.page]||'교육관리';$('#stage').innerHTML=state.page==='learn'?employeePage():state.page==='records'?recordsPage():state.page==='quiz'?quizPage():state.page==='staff'?staffPage():adminPage();if(state.page==='learn'){attachVideo();attachSignature()}}
function topNote(){return `<div class="notice"><b>홈페이지 체험판</b> · 이 브라우저에만 데이터가 저장됩니다. 실제 직원 개인정보를 입력하지 마세요. 관리자인증·직원 간 공유·법정교육 이수판정은 연결되지 않았습니다. 유튜브 시청기록은 재생 API 사용이 가능할 때만 기록합니다.</div>`}
function adminPage(){let c=course();let signs=Object.values(data.records).filter(r=>r.signedAt).length;return `${topNote()}<div class="hero"><div><span class="pill">FCT 통합 교육관리</span><h2>교육부터 전자서명까지,<br>한 곳에서 관리하세요.</h2><p>유튜브 영상 · 추가 교육자료 · 평가문제 편집 · 서명 · 교육별 이수현황</p></div><button class="btn big" data-action="create">＋ 새 교육 등록</button></div><div class="stats"><div class="stat"><div class="label">등록 교육</div><div class="num">${data.courses.length}<span class="small">건</span></div><div class="hint">교육별 분리 관리</div></div><div class="stat"><div class="label">등록 직원</div><div class="num">${data.employees.length}<span class="small">명</span></div><div class="hint">직원명부 편집 가능</div></div><div class="stat"><div class="label">전자서명</div><div class="num">${signs}<span class="small">건</span></div><div class="hint">체험 기록 포함</div></div><div class="stat"><div class="label">평가문제</div><div class="num">${data.courses.reduce((a,x)=>a+(x.quiz.questions||[]).length,0)}<span class="small">문항</span></div><div class="hint">교육별 수정 가능</div></div></div><div class="grid2"><section><div class="section-head"><div><h3>등록된 교육</h3><p>교육을 선택하면 우측에서 자료를 관리할 수 있어.</p></div><button class="btn mini" data-action="create">＋ 추가</button></div>${data.courses.map(x=>`<button class="course-item ${c?.id===x.id?'selected':''}" data-course="${esc(x.id)}"><span class="pill gray">${esc(x.type)}</span>${x.continuous?'<span class="pill">상시 · 자동배정</span>':''}<strong>${esc(x.title)}</strong><span class="meta"><span>▦ ${esc(monthText(x))}</span><span>◷ 최소 ${esc(x.minWatchMinutes||0)}분</span><span>☑ ${x.quiz.questions.length}문항</span><span>▷ ${x.videos.length}개 영상</span></span></button>`).join('')||'<div class="empty">등록된 교육이 없어. 교육을 등록해 줘.</div>'}</section><section class="panel">${c?adminDetail(c):'<div class="panel-pad empty">교육을 등록해 줘.</div>'}</section></div>`}
function adminDetail(c){return `<div class="panel-head"><h3>교육 상세 및 자료 관리</h3><div class="title-row"><button class="btn mini" data-action="edit">수정</button><button class="btn mini danger" data-action="delete-course">삭제</button></div></div><div class="panel-pad"><div class="title-row"><span class="pill">${esc(c.plant)}</span><span class="pill gray">${esc(c.dept)}</span><span class="pill blue">${esc(c.type)}</span></div><h3 class="detail-title">${esc(c.title)}</h3><div class="info-bar"><span>${c.continuous?'♾ 상시 운영 · 신규입사자 자동배정':'📅 '+esc(monthText(c))}</span><span>◷ 예정 교육 ${esc(c.duration)}분</span><span>✓ 최소 영상시청 ${esc(c.minWatchMinutes||0)}분</span></div><p class="desc">${esc(c.description)}</p><div class="line"></div><div class="flex-between"><h4 class="subheading">▷ 유튜브 영상 (${c.videos.length})</h4><span class="tag">여러 개 영상 등록 가능</span></div>${c.videos.map((v,i)=>`<div class="media-item"><div class="ico">▶️</div><div class="body"><strong>${esc(v.title||'유튜브 교육영상 '+(i+1))}</strong><small>${esc(v.url)}</small></div><div class="right"><button class="btn mini" data-action="open-video" data-id="${esc(v.id)}">열기</button><button class="btn mini danger" data-action="remove-video" data-id="${esc(v.id)}">삭제</button></div></div>`).join('')||'<div class="empty">등록된 영상이 없습니다. 아래에 유튜브 주소를 붙여넣으세요. 여러 개를 추가할 수 있습니다.</div>'}<div class="inline-form"><input class="input" id="newVideoTitle" placeholder="영상 제목 (선택)" aria-label="영상 제목"/><input class="input" id="newVideoUrl" placeholder="https://www.youtube.com/watch?v=..." aria-label="유튜브 주소"/><button class="btn primary" data-action="add-video">+ 등록</button></div><div class="line"></div><div class="flex-between"><h4 class="subheading">▤ 추가 교육자료 (${c.materials.length})</h4><span class="tag">PDF · PPT · 이미지 · 엑셀</span></div>${c.materials.map(m=>materialRow(m,true)).join('')||'<div class="empty">첨부자료가 없습니다.</div>'}<div class="inline-form"><label class="btn file-select">＋ 자료 업로드<input type="file" id="adminFiles" multiple accept=".pdf,.ppt,.pptx,.xls,.xlsx,.doc,.docx,.png,.jpg,.jpeg,.txt" hidden/></label><span class="form-tip">데모는 파일당 1.5MB 이내, 브라우저 내 저장입니다. PPT는 다운로드 방식으로 제공됩니다.</span></div><div class="line"></div><div class="flex-between"><h4 class="subheading">☑ 평가문제 (${c.quiz.questions.length}문항)</h4><button class="btn mini primary" data-action="to-quiz">문제 추가 · 수정 →</button></div><p class="small muted">합격 ${c.quiz.passingScore}점 이상 · ${c.quiz.questionCount}문항 출제 · ${c.quiz.published?'출제 승인':'검토 필요'}</p><div class="line"></div><div class="flex-between"><h4 class="subheading">교육 이수 현황</h4><div class="title-row"><button class="btn mini primary" data-action="manage-targets">수강대상 직접 지정</button><button class="btn mini" data-action="to-records">전체 보기 ↗</button></div></div>${attendanceTable(c,true)}<div class="inline-form"><button class="btn" data-action="print">▧ 교육일지 인쇄 / PDF</button><button class="btn" data-action="print-cert-completed">수료자 수료확인서 출력</button><button class="btn" data-action="export">↓ 이수현황 CSV</button><button class="btn primary" data-action="to-learn">직원 화면 체험 →</button></div></div>`}
function materialRow(m,admin=false){const kind=m.kind==='note'?'📝':/\.pdf$/i.test(m.name)?'📕':/\.(jpg|jpeg|png)$/i.test(m.name)?'🖼️':'📁';return `<div class="media-item"><div class="ico">${kind}</div><div class="body"><strong>${esc(m.name)}</strong><small>${m.kind==='note'?'내용 확인용 샘플':'업로드 자료 · '+esc(Math.round((m.size||0)/1024))+'KB'}</small></div><div class="right"><button class="btn mini" data-action="view-material" data-id="${esc(m.id)}">${admin?'확인':'열람하기'}</button>${admin?`<button class="btn mini danger" data-action="remove-material" data-id="${esc(m.id)}">삭제</button>`:''}</div></div>`}
function attendanceTable(c,compact=false){let es=roster(c),rows=compact?es:filteredRoster(c);return `<div class="table-wrap"><table class="data-table"><thead><tr><th>직원</th><th>부서</th>${c.continuous?'<th>입사일</th>':''}<th>시청 진도</th>${compact?'':'<th>실제 재생시간</th>'}<th>평가</th><th>서명</th><th>이수상태</th></tr></thead><tbody>${rows.map(e=>{let r=peek(c.id,e.id),v=videoWatch(c,r);return `<tr><td><strong>${esc(e.name)}</strong><div class="tiny muted">${esc(e.empNo||'')}</div></td><td>${esc(e.dept)}</td>${c.continuous?`<td>${esc(e.hireDate||'-')}</td>`:''}<td>${c.videos.length?v.percent+'%':'영상 없음'}</td>${compact?'':`<td>${fmt(r.watchSeconds||0)}</td>`}<td>${r.quizPassed?'합격 '+(r.lastScore===null?'':r.lastScore+'점'):r.quizAttempts?'미합격 '+(r.lastScore===null?'':r.lastScore+'점'):'미응시'}</td><td>${r.signedAt?'완료':'미완료'}</td><td>${status(c,r)}</td></tr>`}).join('')||'<tr><td colspan="${c.continuous?8:7}">조건에 해당하는 직원이 없어.</td></tr>'}</tbody></table></div>`}
function filteredRoster(c){return roster(c).filter(e=>{let r=peek(c.id,e.id),lab=labelStatus(c,r);let f=state.recordFilter,ok=f==='전체'||(f==='미이수'&&!complete(c,r))||(f==='미수강'&&lab==='미수강')||(f==='수강 중'&&lab==='수강 중')||(f==='이수완료'&&lab==='이수완료')||(f==='체험완료'&&lab==='체험완료');let period=true;if(c.continuous&&state.recordPeriod!=='전체 누적'){let date=(c.enrollments.find(x=>x.employeeId===e.id)?.assignedAt||e.hireDate||'').slice(0,10),today=new Date().toLocaleDateString('sv-SE');period=state.recordPeriod==='이번 달'?date.slice(0,7)===today.slice(0,7):date.slice(0,4)===today.slice(0,4)}return ok&&period&&(state.recordDept==='전체'||e.dept===state.recordDept)&&(!state.recordSearch||(e.name+' '+(e.empNo||'')).includes(state.recordSearch))})}
function recordsPage(){let c=course();if(!c)return topNote()+'<div class="empty">교육이 없어.</div>';let x=rates(c);return `${topNote()}<div class="section-head"><div><h3>교육별 참여 · 이수 · 서명 현황</h3><p>관리자가 지정한 대상자만 표시되며, 교육을 시작하지 않은 직원도 미수강으로 집계됩니다.</p></div><div class="inline-form"><button class="btn" data-action="manage-targets">수강대상 지정</button><button class="btn" data-action="export">↓ 엑셀용 CSV</button><button class="btn dark" data-action="print">▧ 교육일지 인쇄 / PDF</button><button class="btn" data-action="print-cert-completed">이수완료자 수료확인서 일괄 출력</button><button class="btn primary" data-action="print-cert-all" ${x.all===0||x.done!==x.all?'disabled title="전체 대상자가 수료한 뒤 출력할 수 있습니다"':''}>전체 인원 수료확인서 출력</button></div></div><div class="panel panel-pad"><div class="field"><label>조회할 교육</label><select id="recordsCourse">${data.courses.map(v=>`<option value="${esc(v.id)}" ${v.id===c.id?'selected':''}>${esc(v.title)}</option>`).join('')}</select></div><div class="title-row"><span class="pill gray">${c.continuous?'상시 운영 · 신규직원 자동배정':esc(monthText(c))}</span><span class="pill blue">교육 설정 ${esc(c.duration)}분 / 최소 영상시청 ${esc(c.minWatchMinutes||0)}분</span><span class="pill gray">대상 ${esc(c.plant)} / ${esc(c.dept)}</span></div><div class="stat-grid">${[['교육대상',x.all+'명'],['수강시작',x.started+'명'],['이수완료',x.done+'명'],['수강 중',Math.max(0,x.started-x.done)+'명'],['미수강',x.notStarted+'명']].map(z=>`<div class="stat"><div class="label">${z[0]}</div><div class="num">${z[1]}</div></div>`).join('')}</div><div class="rate-section"><div class="metric-line"><b>수강률</b><b>${x.startRate}%</b></div><div class="rate-wrap"><span class="rate-fill" style="width:${x.startRate}%"></span></div><div class="metric-line" style="margin-top:16px"><b>최종 이수율</b><b>${x.rate}%</b></div><div class="rate-wrap"><span class="rate-fill" style="width:${x.rate}%"></span></div></div><div class="line"></div>${c.continuous?`<div class="notice"><b>상시교육 · 누적 관리</b> · 입사자가 추가될 때마다 자동 배정되어 과거 입사자까지 같은 교육에서 계속 조회됩니다. 교육은 자동으로 종료되지 않으며 직원별 수료일로 증빙을 구분합니다. <button class="btn mini" data-action="assign-existing">기존 직원 수동 배정</button></div>`:''}<div class="filter-grid">${c.continuous?`<div class="field"><label>등록 시기</label><select id="recordPeriod">${['전체 누적','이번 달','올해'].map(v=>`<option ${v===state.recordPeriod?'selected':''}>${v}</option>`).join('')}</select></div>`:''}<div class="field"><label>이수 상태</label><select id="recordFilter">${['전체','이수완료','수강 중','미수강','미이수','체험완료'].map(v=>`<option ${v===state.recordFilter?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>부서</label><select id="recordDept">${['전체',...new Set(roster(c).map(e=>e.dept))].map(v=>`<option ${v===state.recordDept?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>성명 / 사번 검색</label><input class="input" id="recordSearch" placeholder="직원명 또는 사번" value="${esc(state.recordSearch)}"/></div></div><p class="small muted">현재 표시: ${filteredRoster(c).length}명 / 전체 대상 ${x.all}명</p>${attendanceTable(c)}<div class="line"></div><h4 class="subheading">교육 증빙 및 서명 기록</h4><p class="small muted">전체 대상자 수료확인서는 이수율 100%일 때 활성화됩니다. 부분 이수 상황에서는 이수완료자만 따로 일괄 출력할 수 있습니다.</p><p class="small muted">※ 교육일지에는 이 브라우저에 저장된 직원별 손글씨 서명 이미지만 포함됩니다. 휴대폰별 공동저장은 서버 연동 후 가능합니다.</p><p class="small muted">실제 영상 재생시간과 교육 설정시간을 구분해 표시해. 이 데모 기록은 법정교육 이수 증빙이 아니야.</p>${roster(c).filter(e=>peek(c.id,e.id).signedAt).map(e=>{let r=peek(c.id,e.id);return `<div class="media-item"><div class="ico">✍️</div><div class="body"><strong>${esc(e.name)} · ${esc(e.dept)}</strong><small>서명시각 ${esc(r.signedAt)} · ${r.demo?'체험기록':'로컬 시연 기록'}</small></div><div class="right"><button class="btn mini" data-action="view-sign" data-id="${esc(e.id)}">서명 확인</button></div></div>`}).join('')||'<div class="empty">서명 기록이 없어.</div>'}</div>`}

function employeePage(){let c=course(),e=employee();if(!c)return topNote()+'<div class="empty">등록된 교육이 없습니다.</div>';let mine=data.courses.filter(x=>roster(x).some(z=>z.id===e.id));if(!mine.length)return topNote()+`<div class="employee-welcome"><h2>${esc(e.name)}님, 안녕하세요.</h2><button class="btn mini" data-action="change-user">체험 사용자 변경</button></div><div class="empty">현재 배정된 교육이 없습니다.</div>`;let r=record(c.id,e.id),v=videoWatch(c,r),ready=courseReady(c,r);if(!mine.some(x=>x.id===c.id)&&mine.length){c=mine[0];state.courseId=c.id;r=record(c.id,e.id);v=videoWatch(c,r);ready=courseReady(c,r)}return `${topNote()}<div class="employee-welcome"><div><div class="mini-kicker">나의 교육</div><h2>${esc(e.name)}님, 안녕하세요.</h2><p>${esc(e.dept)} · ${esc(e.plant)} · 현재 ${mine.filter(x=>complete(x,peek(x.id,e.id))).length}/${mine.length}개 교육 이수완료</p></div><button class="btn mini" data-action="change-user">체험 사용자 변경</button></div><div class="my-courses">${mine.map(x=>{let rr=peek(x.id,e.id),done=complete(x,rr);return `<button class="my-course ${c.id===x.id?'chosen':''}" data-learn-course="${esc(x.id)}"><strong>${esc(x.title)}</strong><span>${done?'✓ 이수완료':labelStatus(x,rr)} · 최소 영상 ${x.minWatchMinutes||0}분 · ${x.continuous?'상시 수강':esc(monthText(x))}</span></button>`}).join('')||'<p class="empty">대상 교육이 없습니다.</p>'}</div>${!roster(c).some(x=>x.id===e.id)?'<div class="notice">이 교육의 대상이 아닙니다. 관리자에게 문의하세요.</div>':''}<div class="learn-layout"><div><section class="panel panel-pad" style="margin-bottom:16px"><div class="title-row"><span class="pill">${esc(c.type)}</span><span class="pill gray">${esc(c.plant)}</span></div><h2 class="detail-title">${esc(c.title)}</h2><div class="info-bar"><span>${c.continuous?'♾ 상시 수강':'📅 '+esc(monthText(c))}</span><span>◷ 교육 설정 ${esc(c.duration)}분</span><span>✓ 최소 학습 ${esc(c.minWatchMinutes||0)}분</span></div><p class="desc">${esc(c.description)}</p><div class="steps"><span class="${minutesReady(c,r)?'done':''}">① 영상 ${fmt(v.watched)} / ${c.minWatchMinutes||0}분</span><span class="${c.materials.every(m=>r.materialIds.includes(m.id))?'done':''}">② 자료 확인</span><span class="${r.quizPassed?'done':''}">③ 평가</span><span class="${r.signedAt?'done':''}">④ 서명</span></div><div class="line"></div><div class="section-head"><h3>① 유튜브 교육영상</h3><span class="pill gray">${c.videos.length}개 등록</span></div><div class="video-frame" id="videoFrame">${c.videos.length?'<div id="videoPlayer" style="width:100%;height:100%"></div>':'<div class="empty-vid">▶<br>등록된 유튜브 영상이 없습니다.<br><small>관리자 화면에서 링크를 등록해 보세요.</small></div>'}</div>${c.videos.length?`<div class="vid-list">${c.videos.map((x,i)=>`<button class="video-tab ${state.activeVideo===i?'active':''}" data-play-video="${i}">▷ ${esc(x.title||'교육영상 '+(i+1))}</button>`).join('')}</div><p class="form-tip" style="margin-top:10px">영상 재생 API가 제공되는 경우, 실제 재생한 구간만 기록합니다. 유튜브 외부 페이지에서 본 시간은 기록할 수 없습니다.</p>`:''}<div class="line"></div><div class="section-head"><h3>② 추가 교육자료</h3><span class="pill gray">${c.materials.length}개</span></div>${c.materials.map(m=>`${materialRow(m)}${r.materialIds.includes(m.id)?'<div class="tiny" style="color:#159a94;margin:-3px 0 9px 48px">✓ 열람 확인</div>':''}`).join('')||'<div class="empty">등록된 교육자료가 없습니다.</div>'}</section>${employeeQuiz(c,e,r)}</div><aside><section class="panel panel-pad" style="margin-bottom:16px"><div class="section-head"><h3>나의 교육 이수 현황</h3>${status(c,r)}</div><div class="metric-line"><span class="muted">영상 진행률 (전체 영상 기준)</span><strong id="livePercent">${v.percent}%</strong></div><div class="progress"><span id="liveBar" style="width:${v.percent}%"></span></div><div class="metric-line"><span class="muted">수료를 위한 최소 시청시간</span><strong>${c.minWatchMinutes||0}분</strong></div><div class="metric-line"><span class="muted">중복 제외 시청시간</span><strong id="liveUnique">${fmt(v.watched)}</strong></div><div class="line" style="margin:16px 0"></div><div class="metric-line"><span class="muted">실제 관측 시청시간</span><strong id="liveWatch">${fmt(r.watchSeconds)}</strong></div><div class="metric-line"><span class="muted">교육자료 확인</span><strong>${r.materialIds.length}/${c.materials.length}</strong></div><div class="metric-line"><span class="muted">평가 결과</span><strong>${r.quizPassed?'합격 '+(r.lastScore??'')+'점':r.quizAttempts?'미합격 '+(r.lastScore??'')+'점':'미응시'}</strong></div><div class="metric-line"><span class="muted">전자서명</span><strong>${r.signedAt?'완료':'대기'}</strong></div><div class="line"></div><div class="check-list"><div class="check-item"><span class="check-dot ${minutesReady(c,r)?'done':''}">${minutesReady(c,r)?'✓':'1'}</span>최소 영상시청 ${c.minWatchMinutes||0}분 충족 (${fmt(v.watched)})</div><div class="check-item"><span class="check-dot ${c.materials.every(m=>r.materialIds.includes(m.id))?'done':''}">${c.materials.every(m=>r.materialIds.includes(m.id))?'✓':'2'}</span>교육자료 모두 열람</div><div class="check-item"><span class="check-dot ${r.quizPassed?'done':''}">${r.quizPassed?'✓':'3'}</span>이해도 평가 합격</div></div></section><section class="panel panel-pad"><div class="section-head"><h3>④ 전자서명</h3>${r.signedAt?'<span class="pill">서명됨</span>':'<span class="pill gray">대기</span>'}</div>${r.signedAt?`<div class="light-box"><b>${esc(e.name)}님의 서명이 저장되었습니다.</b><br>서명시각: ${esc(r.signedAt)}<br>${r.demo?'<b style="color:#a66b19">체험 완료(법정 증빙 불가)</b>':'교육 서명 기록'}</div><img style="width:100%;max-height:150px;object-fit:contain;margin:8px 0" src="${r.signature}" alt="저장된 전자서명"/><div class="form-tip">내 교육 목록에서 다른 교육도 확인할 수 있습니다.</div>`:`<p class="small muted">교육이수 요건 충족 후 손가락이나 마우스로 서명하세요.</p><div class="signature"><canvas id="signCanvas" aria-label="손글씨 전자서명 입력"></canvas></div><div class="flex-between" style="margin:8px 0 12px"><small class="muted">서명란에 직접 작성</small><button class="btn mini" data-action="clear-sign">지우기</button></div><label class="check-row"><input type="checkbox" id="signConsent"/> 본인이 교육내용을 확인하고 직접 서명합니다.</label><button class="btn primary full big" style="margin-top:13px" data-action="sign">전자서명 제출</button>${!ready?'<p class="form-tip">최소 영상시청시간·자료 열람·평가를 완료해야 서명할 수 있습니다.</p>':''}<div class="demo-mode" style="margin-top:12px"><b>빠른 체험 기능</b><br>영상 전체를 시청하지 않고 화면을 시험하고 싶다면 아래를 누르세요. 이 경우 저장되는 서명은 <b>체험기록</b>으로 명확히 구분됩니다.<br><button class="btn mini" style="margin-top:8px" data-action="demo-unlock">체험용 서명 활성화</button></div>`}</section></aside></div>`}

function employeeQuiz(c,e,r){let q=c.quiz;if(!q.published)return '<section class="panel panel-pad"><h3>③ 교육 이해도 평가</h3><p class="small muted">문제가 아직 승인되지 않았어. 관리자에게 문의해 줘.</p></section>';let chosen=examQuestions(c,e,r),limit=q.attemptLimit,locked=!r.quizPassed&&limit>0&&(r.quizAttempts||0)>=limit;return `<section class="panel panel-pad"><div class="section-head"><h3>③ 교육 이해도 평가</h3>${r.quizPassed?'<span class="pill">합격</span>':`<span class="pill gray">${q.passingScore}점 이상 합격</span>`}</div><p class="small muted">${chosen.length}문항 · 합격기준 ${q.passingScore}점 · 응시 ${r.quizAttempts||0}회${limit?' / 최대 '+limit+'회':' / 제한 없음'} · ${q.shuffle?'직원별 문제 순서 변경':'등록 순서 출제'}</p>${r.quizPassed?`<div class="quiz-note">✓ 평가 통과 · 최근 점수 ${r.lastScore??'-'}점<br>제출한 평가내용은 관리기록에 보존되고, 이후 문제가 수정되어도 이전 결과는 유지돼.</div>`:locked?'<div class="quiz-note">응시 가능 횟수를 모두 사용했어. 관리자에게 문의해 줘.</div>':chosen.length?`<form id="examForm">${chosen.map((item,i)=>`<div class="quiz-block"><h4>Q${i+1}. ${esc(item.question)}</h4>${item.choices.map((opt,j)=>`<label class="quiz-choice"><input type="radio" name="exam_${esc(item.id)}" value="${j}" ${state.quizAnswers[item.id]===j?'checked':''}/> ${esc(opt)}</label>`).join('')}</div>`).join('')}</form><button class="btn primary" data-action="quiz-submit">평가 제출 및 채점</button>`:'<div class="empty">등록된 평가문제가 없어.</div>'}${r.quizAttempts&&!r.quizPassed?`<div class="quiz-note" style="margin-top:10px">최근 점수: ${r.lastScore}점 · ${r.lastScore>=q.passingScore?'합격':'불합격'}</div>`:''}<p class="form-tip">교육평가는 관리자가 검토한 문제로 운영되며, 법정 교육 인정 여부는 교육 유형별 기준에 따라 별도 확인해야 해.</p></section>`}
function quizPage(){let c=course();if(!c)return topNote()+'<div class="empty">교육을 먼저 등록해 줘.</div>';let q=c.quiz;return `${topNote()}<div class="section-head"><div><h3>교육별 평가문제 관리</h3><p>문제 수정·추가·삭제, 합격기준, 응시 횟수와 출제 승인까지 설정해.</p></div><button class="btn" data-action="to-learn">직원 평가 화면 →</button></div><div class="panel panel-pad"><div class="field"><label>교육 선택</label><select id="quizCourse">${data.courses.map(v=>`<option value="${esc(v.id)}" ${v.id===c.id?'selected':''}>${esc(v.title)}</option>`).join('')}</select></div><h3 class="subheading">시험 설정</h3><form id="quizSettings"><div class="settings-grid"><div class="field"><label>출제 문항 수</label><input name="questionCount" class="input" type="number" min="1" max="100" value="${q.questionCount}"/></div><div class="field"><label>합격 점수</label><input name="passingScore" class="input" type="number" min="0" max="100" value="${q.passingScore}"/></div><div class="field"><label>최대 응시 횟수 (0=무제한)</label><input name="attemptLimit" class="input" type="number" min="0" max="20" value="${q.attemptLimit}"/></div><div class="field"><label>문제 순서</label><select name="shuffle"><option value="yes" ${q.shuffle?'selected':''}>직원별 섞기</option><option value="no" ${!q.shuffle?'selected':''}>등록 순서</option></select></div></div><label class="check-row" style="margin-bottom:12px"><input type="checkbox" name="published" ${q.published?'checked':''}/> 관리자 승인 후 직원에게 문제 공개</label><div class="inline-form"><button class="btn primary" data-action="save-quiz-settings">설정 저장</button><span class="pill ${q.published?'':'warn'}">${q.published?'출제 승인':'관리자 검토 중'}</span><span class="pill gray">문항 버전 ${q.version}</span></div></form><div class="line"></div><div class="section-head"><div><h3>등록된 문제 (${q.questions.length}개)</h3><p>문제 수정 시 기존 응시기록과 점수는 그대로 보존돼.</p></div><div class="inline-form"><button class="btn" data-action="suggest-questions">＋ 예시문제 자동 구성</button><button class="btn primary" data-action="add-question">＋ 문제 직접 추가</button></div></div><div class="quiz-note">예시문제 자동 구성은 미리 마련한 안전보건 문제은행에서 관련 문항을 추가하는 기능이야. 현재 데모에는 업로드한 PDF를 AI로 분석하는 기능은 연결되지 않았어. 담당자 검토 후 승인해 줘.</div><div class="quiz-edit-list">${q.questions.map((it,i)=>`<div class="quiz-edit"><div class="flex-between"><span class="pill gray">Q${i+1} · ${it.type==='ox'?'OX':'객관식'}</span><span class="quiz-meta">${esc(it.id)}</span></div><h4>${esc(it.question)}</h4><p>${it.choices.map((o,j)=>(j===it.answer?'✓ ':'')+esc(o)).join(' · ')}</p><p style="color:#148880"><b>정답: ${esc(it.choices[it.answer]||'-')}</b>${it.explanation?' · 해설: '+esc(it.explanation):''}</p><div class="quiz-actions"><button class="btn mini" data-action="edit-question" data-id="${esc(it.id)}">수정</button><button class="btn mini" data-action="copy-question" data-id="${esc(it.id)}">복제</button><button class="btn mini danger" data-action="delete-question" data-id="${esc(it.id)}">삭제</button></div></div>`).join('')||'<div class="empty">등록된 문항이 없어. 문제를 추가해 줘.</div>'}</div><div class="inline-form"><button class="btn" data-action="export-quiz">↓ 문제은행 CSV 다운로드</button><span class="form-tip">기존 수강자 응시 기록에는 문항·정답·답안·점수가 저장돼.</span></div></div>`}
function quizEditor(id){let c=course();let item=c.quiz.questions.find(q=>q.id===id)||null;let type=item?.type==='ox'?'ox':'multiple';let choices=item?.choices||['','','',''];modal(item?'평가문제 수정':'새 평가문제 추가',`<form id="questionEditor"><div class="field"><label>문제 유형</label><select name="type" id="editorType"><option value="multiple" ${type==='multiple'?'selected':''}>객관식 (2~5개 보기)</option><option value="ox" ${type==='ox'?'selected':''}>OX 문제</option></select></div><div class="field"><label>문제 내용 *</label><textarea name="question" rows="3" required maxlength="500">${esc(item?.question||'')}</textarea></div><div id="editorOptions">${editorOptions(choices,type,item?.answer||0)}</div><div class="field"><label>정답 해설 (선택)</label><textarea name="explanation" rows="2" maxlength="800">${esc(item?.explanation||'')}</textarea></div></form><p class="form-tip">정답을 선택하고 저장해 줘. 이전 응시기록은 수정되지 않아.</p>`,`<button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="save-question" data-id="${esc(id||'')}">문제 저장</button>`)}
function editorOptions(choices,type,answer){if(type==='ox')return `<label class="field">정답 선택</label><label class="quiz-choice"><input type="radio" name="correct" value="0" ${answer===0?'checked':''}/> O</label><label class="quiz-choice"><input type="radio" name="correct" value="1" ${answer===1?'checked':''}/> X</label>`;return `<label class="field">보기 및 정답 선택 (빈 보기는 제외)</label><div class="question-editor-options">${Array.from({length:5},(_,i)=>`<div class="question-editor-option"><input type="radio" name="correct" value="${i}" ${i===answer?'checked':''} title="보기 ${i+1}을 정답으로 선택"/><input class="input" name="choice${i}" value="${esc(choices[i]||'')}" placeholder="보기 ${i+1}" maxlength="200"/></div>`).join('')}</div>`}
function saveQuestion(id){let f=$('#questionEditor');if(!f?.reportValidity())return;let fd=new FormData(f),type=String(fd.get('type')),question=String(fd.get('question')||'').trim(),correct=Number(fd.get('correct'));if(!question)return toast('문제 내용을 입력해 줘.');let choices=type==='ox'?['O','X']:Array.from({length:5},(_,i)=>String(fd.get('choice'+i)||'').trim());if(type==='multiple'){if(choices.filter(Boolean).length<2)return toast('객관식 보기는 2개 이상 입력해 줘.');if(!choices[correct])return toast('정답 보기에는 내용을 입력해 줘.');correct=choices.slice(0,correct).filter(Boolean).length;choices=choices.filter(Boolean)}if(correct<0||correct>=choices.length)return toast('정답을 선택해 줘.');let c=course(),q=c.quiz;let next={id:id||uid('q'),type,question,choices,answer:correct,explanation:String(fd.get('explanation')||'').trim()};if(id)q.questions=q.questions.map(it=>it.id===id?next:it);else q.questions.push(next);q.version++;q.published=false;save();closeModal();render();toast(id?'문제를 수정했어. 재승인 후 직원에게 공개돼.':'문제를 추가했어. 승인 후 직원에게 공개돼.')}
function saveQuizSettings(){let f=$('#quizSettings'),fd=new FormData(f),c=course(),q=c.quiz,count=Number(fd.get('questionCount')),pass=Number(fd.get('passingScore')),limit=Number(fd.get('attemptLimit'));if(!Number.isInteger(count)||count<1||count>100)return toast('출제 문항 수를 확인해 줘.');if(count>q.questions.length)return toast('등록된 문제보다 출제 문항 수가 많아. 문제를 추가해 줘.');if(pass<0||pass>100)return toast('합격 점수는 0~100점이야.');if(limit<0||limit>20)return toast('응시 횟수는 0~20으로 지정해 줘.');q.questionCount=count;q.passingScore=pass;q.attemptLimit=limit;q.shuffle=fd.get('shuffle')==='yes';q.published=fd.has('published');q.version++;save();render();toast(q.published?'시험 설정을 승인·저장했어.':'설정을 초안으로 저장했어.')}
function addSuggested(){let c=course(),q=c.quiz;let source=/(가스|질소|수소|냉동)/.test(c.title+' '+c.description)?[safetyExamples[8],...safetyExamples]:safetyExamples;let added=0;for(const ex of source){if(q.questions.some(z=>z.question===ex.question))continue;q.questions.push({id:uid('q'),type:ex.type||'multiple',question:ex.question,choices:[...ex.choices],answer:ex.answer,explanation:ex.explanation});added++;if(added>=5)break}if(!added)return toast('추가할 예시문제가 없어. 직접 추가해 줘.');q.published=false;q.version++;save();render();toast('예시문제 '+added+'개를 추가했어. 담당자 검토 후 승인해 줘.')}
function staffPage(){let active=data.employees.filter(e=>e.employmentStatus!=='퇴사').length;return `${topNote()}<div class="section-head"><div><h3>직원명부 · 신규 입사자 등록</h3><p>신규 입사자를 추가하면 해당 공장·부서의 상시교육에 즉시 자동 배정돼. 기존 이수이력은 계속 보존돼.</p></div><button class="btn primary" data-action="add-employee">＋ 신규 입사자 등록</button></div><div class="panel panel-pad"><div class="staff-upload"><button class="btn" data-action="template-staff">↓ 직원명부 양식 CSV</button><label class="btn file-select">↑ 직원명부 CSV 업로드<input id="staffCsv" type="file" accept=".csv,text/csv,.txt" hidden/></label><button class="btn" data-action="export-staff">↓ 직원명부 CSV</button></div><p class="form-tip">전체 ${data.employees.length}명 · 재직 ${active}명 · 퇴사 ${data.employees.length-active}명. 입사일과 재직상태도 CSV로 관리할 수 있어. 직원 삭제 대신 퇴사 처리하면 기존 수료증과 이력은 남아.</p><div class="line"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>사번</th><th>성명</th><th>부서</th><th>공장</th><th>입사일</th><th>재직상태</th><th>작업</th></tr></thead><tbody>${data.employees.map(e=>`<tr><td>${esc(e.empNo||'')}</td><td><strong>${esc(e.name)}</strong></td><td>${esc(e.dept)}</td><td>${esc(e.plant)}</td><td>${esc(e.hireDate||'-')}</td><td>${esc(e.employmentStatus||'재직')}</td><td><button class="btn mini" data-action="edit-employee" data-id="${esc(e.id)}">수정</button></td></tr>`).join('')}</tbody></table></div></div>`}
function staffEditor(id){let e=data.employees.find(x=>x.id===id);modal(e?'직원정보 수정':'신규 입사자 등록',`<form id="staffEditor"><div class="field"><label>사번 (중복 불가)</label><input class="input" name="empNo" value="${esc(e?.empNo||'')}" maxlength="30"/></div><div class="fields2"><div class="field"><label>성명 *</label><input class="input" name="name" value="${esc(e?.name||'')}" required maxlength="30"/></div><div class="field"><label>부서 *</label><select name="dept">${['경영지원','전반','박막','가공','소성','품질'].map(x=>`<option ${e?.dept===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="fields2"><div class="field"><label>공장</label><select name="plant"><option ${e?.plant==='2공장'||!e?'selected':''}>2공장</option><option ${e?.plant==='1공장'?'selected':''}>1공장</option></select></div><div class="field"><label>입사일</label><input class="input" name="hireDate" type="date" value="${esc(e?.hireDate||new Date().toLocaleDateString('sv-SE'))}"/></div></div><div class="field"><label>재직상태</label><select name="employmentStatus">${['재직','퇴사'].map(x=>`<option ${e?.employmentStatus===x?'selected':''}>${x}</option>`).join('')}</select></div><p class="form-tip">신규 등록 시 진행 중인 상시교육에 자동 배정돼요. 퇴사 전환해도 기존 교육이력은 유지됩니다.</p></form>`,`<button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="save-employee" data-id="${esc(id||'')}">저장</button>`) }
function saveEmployee(id){let f=$('#staffEditor');if(!f?.reportValidity())return;let fd=new FormData(f),empNo=String(fd.get('empNo')||'').trim(),name=String(fd.get('name')||'').trim(),dept=String(fd.get('dept')),plant=String(fd.get('plant')),hireDate=String(fd.get('hireDate')||''),employmentStatus=String(fd.get('employmentStatus')||'재직');if(!name)return toast('성명을 입력해 주세요.');if(empNo&&data.employees.some(e=>e.empNo===empNo&&e.id!==id))return toast('이미 등록된 사번입니다.');let added=0;if(id){Object.assign(data.employees.find(x=>x.id===id),{name,empNo,dept,plant,hireDate,employmentStatus})}else{let obj={id:uid('s'),name,empNo,dept,plant,hireDate,employmentStatus};data.employees.push(obj);state.employeeId=obj.id;added=autoEnrollNewHire(obj)}save();closeModal();render();toast(id?'직원정보를 저장했습니다.':`신규 입사자 등록 완료 · 상시교육 ${added}개 자동 배정`)}
function csvEscape(x){return '"'+String(x??'').replaceAll('"','""')+'"'}
function csvDownload(name,rows){let csv='\ufeff'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),name)}
function csvParse(text){let out=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
async function importStaff(file){if(!file)return;let text=await file.text(),rows=csvParse(text.replace(/^\ufeff/,'')),head=rows.shift()?.map(x=>x.trim())||[],idx=x=>head.indexOf(x);if(idx('성명')<0||idx('부서')<0)return toast('CSV 첫 줄에 성명, 부서 열이 필요합니다. 양식을 이용해 주세요.');let added=0,updated=0,assigned=0;for(let row of rows){let name=String(row[idx('성명')]||'').trim(),dept=String(row[idx('부서')]||'').trim(),empNo=idx('사번')>=0?String(row[idx('사번')]||'').trim():'',plant=idx('공장')>=0?String(row[idx('공장')]||'').trim()||'2공장':'2공장',hireDate=idx('입사일')>=0?String(row[idx('입사일')]||'').trim():'',employmentStatus=idx('재직상태')>=0?String(row[idx('재직상태')]||'').trim()||'재직':'재직';if(!name||!dept)continue;let exists=data.employees.find(e=>empNo?e.empNo===empNo:(e.name===name&&e.dept===dept&&e.plant===plant));if(exists){Object.assign(exists,{name,dept,empNo:empNo||exists.empNo||'',plant,hireDate:hireDate||exists.hireDate||'',employmentStatus});updated++}else{let e={id:uid('s'),name,dept,empNo,plant,hireDate,employmentStatus};data.employees.push(e);assigned+=autoEnrollNewHire(e);added++}}save();render();toast(`명부 반영: ${added}명 추가, ${updated}명 갱신 · 상시교육 ${assigned}건 자동 배정`) }
function gradeExam(){let c=course(),e=employee(),r=record(),q=c.quiz;if(!q.published)return toast('시험이 아직 승인되지 않았어.');if(r.quizPassed)return toast('이미 합격한 시험이야.');if(q.attemptLimit&&(r.quizAttempts||0)>=q.attemptLimit)return toast('응시 가능 횟수를 모두 사용했어.');let chosen=examQuestions(c,e,r);if(!chosen.length)return toast('출제된 문제가 없어.');let answers=chosen.map(it=>{let checked=document.querySelector(`input[name="exam_${it.id}"]:checked`);return checked?Number(checked.value):null});if(answers.some(a=>a===null))return toast('모든 문제의 답을 선택해 줘.');let correct=chosen.filter((it,i)=>it.answer===answers[i]).length,score=Math.round(correct/chosen.length*100),passed=score>=q.passingScore;r.quizAttempts=(r.quizAttempts||0)+1;r.lastScore=score;r.quizHistory??=[];r.quizHistory.push({at:now(),version:q.version,score,passed,answers:chosen.map((it,i)=>({id:it.id,question:it.question,choices:[...it.choices],answer:it.answer,response:answers[i],explanation:it.explanation}))});r.quizPassed=passed;r.history??=[];r.history.push({event:'quiz_'+(passed?'pass':'fail'),at:now(),score});state.quizAnswers={};save();render();toast(`${passed?'평가 합격':'평가 미합격'} · ${score}점 (${correct}/${chosen.length}문항 정답)`)}

function printCertificates(all=false){let c=course();if(!c)return;let es=roster(c),valid=es.filter(e=>complete(c,peek(c.id,e.id)));if(!valid.length)return toast('수료한 직원이 없습니다.');if(all&&valid.length!==es.length)return toast('전체 대상자가 이수완료한 뒤 전체 출력이 가능합니다.');let list=all?es:valid;let html=list.map((e,i)=>{let r=peek(c.id,e.id),v=videoWatch(c,r);return `<article class="certificate"><div class="cert-logo">FCT</div><div class="cert-sub">${esc(c.plant)} 교육관리 · 시연용</div><h1>교육 수료확인서</h1><p class="cert-number">${i+1} / ${list.length}</p><table class="cert-info"><tr><th>성명</th><td>${esc(e.name)}</td><th>부서</th><td>${esc(e.dept)}</td></tr><tr><th>교육명</th><td colspan="3">${esc(c.title)}</td></tr><tr><th>교육월</th><td>${c.continuous?'상시교육':esc(monthText(c))}</td><th>교육구분</th><td>${esc(c.type)}</td></tr><tr><th>이수일시</th><td>${esc(r.signedAt||'-')}</td><th>집합 실시일</th><td>${esc(c.actualDate||'-')}</td></tr><tr><th>등록 교육시간</th><td>${esc(c.duration)}분</td><th>설정 최소 시청</th><td>${esc(c.minWatchMinutes||0)}분</td></tr><tr><th>확인 시청시간</th><td>${fmt(v.watched)}</td><th>평가 점수</th><td>${r.lastScore??'-'}점</td></tr><tr><th>서명일시</th><td colspan="3">${esc(r.signedAt)}</td></tr></table><p class="cert-statement">위 사람은 본 교육관리 체험 과정의 설정된 수료조건을 충족하였음을 확인합니다.</p><p class="cert-date">${esc(r.signedAt||c.actualDate||monthText(c))}</p><p class="cert-issuer">FCT 교육관리 (체험판)</p><p class="cert-caution">※ 시연용 출력물입니다. 법정교육 수료증, 공식 교육이수 증빙으로 사용할 수 없습니다.</p></article>`}).join('');document.querySelector('#printArea').innerHTML=html;document.body.classList.add('cert-print');printReady()}

put type="checkbox" name="targetDepts" value="${d}" ${(c?.targetDepts||((c?.dept&&c.dept!=='전체')?[c.dept]:[])).includes(d)?'checked':''}/> ${d}</label>`).join('')}</div></div><div class="target-options" id="targetPeopleBox" style="${(c?.targetMode||'전체')==='개인별'?'':'display:none'}"><b class="small">대상자 선택 (복수 선택)</b><div class="target-scroll">${data.employees.filter(e=>e.employmentStatus!=='퇴사').map(e=>`<label class="check-row"><input type="checkbox" name="targetIds" value="${esc(e.id)}" ${(c?.targetIds||[]).includes(e.id)?'checked':''}/> ${esc(e.name)} (${esc(e.empNo||'사번 없음')}, ${esc(e.plant)}, ${esc(e.dept)})</label>`).join('')}</div></div></div><div class="field"><label class="check-row"><input type="checkbox" name="continuous" value="yes" ${c?.continuous?'checked':''}/> <b>상시교육으로 운영 (신규 입사자 자동 배정)</b></label><p class="form-tip">채용 시 교육에 추천. 교육을 매번 새로 등록하지 않고 신규 입사자 수강·서명을 계속 누적합니다. 기존 직원은 필요할 때 수동 배정 가능합니다.</p></div><div class="fields2"><div class="field"><label>등록 교육시간 (분) *</label><input class="input" name="duration" type="number" min="1" max="10000" value="${esc(c?.duration||60)}" required/></div><div class="field"><label>수료 최소 영상시청시간 (분)</label><input class="input" name="minWatchMinutes" type="number" min="0" max="10000" value="${esc(c?c.minWatchMinutes:60)}" required/></div></div><p class="form-tip">유튜브 여러 개의 중복 제외 시청시간을 합산합니다. 최소시간 0분은 영상시간 조건 미적용을 뜻합니다.</p><div class="field"><label>교육내용</label><textarea rows="3" name="description" placeholder="교육의 목적과 내용을 입력하세요.">${esc(c?.description||'')}</textarea></div>${edit?'':`<div class="field"><label>유튜브 영상 주소 (선택 · 여러 개면 한 줄에 하나씩)</label><textarea rows="3" name="links" placeholder="https://www.youtube.com/watch?v=..."></textarea></div><div class="field"><label>첨부 교육자료 (선택)</label><input type="file" name="files" accept=".pdf,.ppt,.pptx,.xls,.xlsx,.doc,.docx,.png,.jpg,.jpeg,.txt" multiple/></div>`}<p class="form-tip">이 데모는 교육시간을 입력한다고 법정교육 시간이 인정되는 시스템이 아닙니다.</p></form>`,`<button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="submit-course" data-edit="${edit?'yes':'no'}">${edit?'수정 저장':'교육 등록'}</button>`)}
async function fileData(file){return new Promise((resolve,reject)=>{let fr=new FileReader;fr.onload=()=>resolve({id:uid('m'),name:file.name,kind:'file',size:file.size,type:file.type,data:fr.result});fr.onerror=()=>reject(Error('file read'));fr.readAsDataURL(file)})}
async function addFiles(files,c){if(!files?.length)return;if([...files].some(f=>f.size>1.5*1024*1024)){toast('데모에서는 파일당 1.5MB 이하 자료만 등록할 수 있습니다.');return}const before=c.materials.length;for(let f of files){try{c.materials.push(await fileData(f))}catch(e){toast('첨부파일을 읽지 못했습니다.')}}if(!save()){c.materials.splice(before);return}render();toast(`교육자료 ${c.materials.length-before}개 등록 완료`)}
function showMaterial(m){if(m.kind==='note'){modal(m.name,`<div class="light-box" style="white-space:pre-wrap">${esc(m.text)}</div>`,`<button class="btn primary" data-action="ack-material" data-id="${esc(m.id)}">자료 확인 완료</button>`);return}
const safe=m.type?.startsWith('image/')||/\.(jpg|jpeg|png)$/i.test(m.name);const pdf=/\.pdf$/i.test(m.name);
const preview=safe?`<img src="${m.data}" alt="${esc(m.name)}" style="max-width:100%;max-height:55vh;object-fit:contain"/>`:pdf?`<iframe src="${m.data}" style="width:100%;height:50vh;border:1px solid #e7edef" title="PDF 미리보기"></iframe>`:`<div class="empty">이 파일은 브라우저에서 바로 미리보기 어렵습니다.<br>파일을 내려받아 확인하세요.</div>`;
modal(m.name,`${preview}<div class="inline-form"><a class="btn" href="${m.data}" download="${esc(m.name)}">↓ 파일 다운로드</a></div>`,`<button class="btn primary" data-action="ack-material" data-id="${esc(m.id)}">자료 확인 완료</button>`)}
function exportCsv(){let c=course();if(!c)return;csvDownload('FCT_'+(c.continuous?'상시누적':educationMonth(c))+'_교육별_이수현황_VER2_REV4.csv',[['교육명','교육월','집합교육실시일','교육설정시간(분)','사번','성명','부서','입사일','수강배정일','시청진도(%)','관측재생시간(초)','교육자료 확인','평가점수','평가상태','응시횟수','서명일시','이수상태','체험기록'],...filteredRoster(c).map(e=>{let r=peek(c.id,e.id);return[c.title,educationMonth(c),c.actualDate||'',c.duration,e.empNo||'',e.name,e.dept,e.hireDate||'',c.enrollments?.find(x=>x.employeeId===e.id)?.assignedAt||'',c.videos.length?videoWatch(c,r).percent:'영상미등록',r.watchSeconds||0,(r.materialIds||[]).length+'/'+c.materials.length,r.lastScore??'',r.quizPassed?'합격':r.quizAttempts?'불합격':'미응시',r.quizAttempts||0,r.signedAt||'',labelStatus(c,r),r.demo?'체험':'']})])}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function printReport(){document.body.classList.remove('cert-print');let c=course();if(!c)return;let rows=roster(c).map((e,i)=>{let r=peek(c.id,e.id),w=videoWatch(c,r);return `<tr><td>${i+1}</td><td>${esc(e.dept)}</td><td>${esc(e.name)}</td><td>${c.videos.length?w.percent+'%':'없음'}</td><td>${fmt(r.watchSeconds||0)}</td><td>${r.quizPassed?'합격 '+(r.lastScore??'')+'점':r.quizAttempts?'미합격 '+(r.lastScore??'')+'점':'미응시'}</td><td>${r.signature&&r.signature.startsWith('data:')?`<img src="${r.signature}" alt="서명"/>`:r.signedAt?'체험/서명':'미서명'}</td><td>${esc(r.signedAt||'-')}</td></tr>`}).join('');let x=rates(c);$('#printArea').innerHTML=`<h1>FCT 교육 실시기록 및 참석 서명부</h1><table><tr><th>교육명</th><td colspan="3">${esc(c.title)}</td></tr><tr><th>교육월/운영방식</th><td>${c.continuous?'상시교육(개인별 수료일 기록)':esc(monthText(c))}</td><th>교육구분</th><td>${esc(c.type)}</td></tr><tr><th>집합교육 실시일</th><td>${esc(c.actualDate||'개별 수강(서명일시 참조)')}</td><th>이수일시</th><td>참석자별 서명일시 참조</td></tr><tr><th>공장/대상</th><td>${esc(c.plant)} / ${esc(c.dept)}</td><th>교육설정시간</th><td>${esc(c.duration)}분</td></tr><tr><th>교육내용</th><td colspan="3">${esc(c.description)}</td></tr><tr><th>유튜브 링크</th><td colspan="3">${c.videos.map(v=>esc(v.url)).join('<br>')||'-'}</td></tr><tr><th>추가자료</th><td colspan="3">${c.materials.map(m=>esc(m.name)).join(', ')||'-'}</td></tr><tr><th>이수현황</th><td colspan="3">교육대상 ${x.all}명 / 수강시작 ${x.started}명 / 이수완료 ${x.done}명 / 이수율 ${x.rate}%</td></tr></table><h3>참석 및 서명 내역</h3><table><tr><th>No</th><th>부서</th><th>성명</th><th>진도</th><th>재생시간</th><th>평가</th><th>서명</th><th>서명시각</th></tr>${rows}</table><div class="foot">※ FCT 교육관리 VER2 rev.5 체험용 시스템이며 법정교육 이수 증빙으로 사용하면 안 됩니다.<br>※ 이 브라우저에 저장된 서명 이미지만 인쇄됩니다. 다른 직원 휴대폰의 서명은 정식 서버 연동 전까지 자동으로 수집되지 않습니다.<br>※ 교육설정시간과 실제 관측재생시간은 다르며, 유튜브 재생 기록만으로 법정 인정시간을 단정할 수 없습니다.<br>※ 관리자 검토와 실제 교육운영 및 본인확인, 서버 기록·권한체계가 연결되어야 합니다.</div>`;printReady()}
function stopPlayer(){if(state.player){try{state.player.destroy()}catch(e){}state.player=null}state.playing=false;state.playerLast=null;state.playerVideoId=null}
function attachVideo(){let c=course();if(!c||!c.videos.length)return;let v=c.videos[Math.min(state.activeVideo,c.videos.length-1)],id=videoId(v.url);if(!id)return;state.playerCourse=c.id;state.playerVideoId=v.id;let host=$('#videoPlayer');if(!host)return;let mount=()=>{if(state.role!=='employee'||state.page!=='learn'||!document.querySelector('#videoPlayer'))return;try{state.player=new YT.Player('videoPlayer',{videoId:id,playerVars:{playsinline:1,rel:0,origin:location.protocol.startsWith('http')?location.origin:undefined},events:{onReady:()=>{let d=state.player.getDuration?.()||0;let rr=record();rr.video[v.id]??={secs:[],duration:0};if(d>0){rr.video[v.id].duration=Math.ceil(d);save()}},onStateChange:(event)=>{state.playing=event.data===YT.PlayerState.PLAYING;state.playerLast=null;if(state.playing){let d=state.player?.getDuration?.();let rr=record();rr.video[v.id]??={secs:[],duration:0};if(d>0)rr.video[v.id].duration=Math.ceil(d);save()}}}})}catch(e){host.innerHTML='<div class="empty-vid">영상을 불러올 수 없습니다. 관리자 화면에서 주소를 확인하세요.</div>'}};
if(window.YT&&window.YT.Player){mount();return}if(!state.ytLoaded){state.ytLoaded=true;let s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{state.ytFailed=true;toast('유튜브 API 연결이 차단됐습니다. 인터넷 연결과 재생 허용을 확인해 주세요.')};document.head.appendChild(s)}window.__fctOnYoutubeReady=mount;if(!window.onYouTubeIframeAPIReady)window.onYouTubeIframeAPIReady=()=>{window.__fctOnYoutubeReady?.()}}
function tick(){if(!state.playing||!state.player||state.role!=='employee'||state.page!=='learn'||document.hidden)return;try{let st=state.player.getPlayerState();if(st!==YT.PlayerState.PLAYING)return;let t=state.player.getCurrentTime();let d=state.player.getDuration();if(!Number.isFinite(t)||t<0)return;let r=record();let key=state.playerVideoId;r.video[key]??={secs:[],duration:0};let vv=r.video[key];if(d>0)vv.duration=Math.ceil(d);if(state.playerLast!==null){let dt=t-state.playerLast;if(dt>=.2&&dt<=1.4){let second=Math.floor(t);if(!vv.secs.includes(second))vv.secs.push(second);r.watchSeconds=(r.watchSeconds||0)+1;state.saveN++;if(state.saveN%5===0)save()}}state.playerLast=t;let v=videoWatch(course(),r);if($('#livePercent'))$('#livePercent').textContent=v.percent+'%';if($('#liveBar'))$('#liveBar').style.width=v.percent+'%';if($('#liveWatch'))$('#liveWatch').textContent=fmt(r.watchSeconds);if($('#liveUnique'))$('#liveUnique').textContent=fmt(v.watched)}catch(e){}}
setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{state.playerLast=null;if(document.hidden)save()});window.addEventListener('beforeunload',save);
function attachSignature(){let canvas=$('#signCanvas');state.signatureReady=false;if(!canvas)return;let rect=canvas.getBoundingClientRect();if(rect.width<1)return;let ratio=window.devicePixelRatio||1;canvas.width=Math.floor(rect.width*ratio);canvas.height=Math.floor(142*ratio);let ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#153a45';let down=false;function coord(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);down=true;let p=coord(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.12,p.y+.12);ctx.stroke();state.signatureReady=true});canvas.addEventListener('pointermove',e=>{if(!down)return;let p=coord(e);ctx.lineTo(p.x,p.y);ctx.stroke()});['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,()=>down=false))}
function saveSignature(){let c=course(),e=employee(),r=record();if(r.signedAt){toast('이미 서명한 교육입니다.');return}let consent=$('#signConsent')?.checked;if(!consent){toast('본인 확인란에 체크해 주세요.');return}if(!state.signatureReady){toast('서명란에 직접 서명해 주세요.');return}if(!courseReady(c,r)&&!r.demo){toast('최소 시청시간·자료 확인·평가를 완료해 주세요. 체험하려면 체험용 서명을 활성화할 수 있습니다.');return}let canv=$('#signCanvas');r.signature=canv.toDataURL('image/png');r.signedAt=now();r.history.push({event:r.demo?'demo_signature':'signature',at:r.signedAt});save();toast(r.demo?'체험 서명이 저장됐습니다. 실제 교육 증빙은 아닙니다.':'전자서명이 저장됐습니다.');render()}

function manageTargets(){let c=course();if(!c)return;let on=new Set(roster(c).map(e=>e.id));modal('교육별 대상자 직접 지정',`<p class="small muted">이 교육에 배정할 직원을 선택해 주세요. 제외하는 직원의 과거 응시·서명 기록은 삭제하지 않습니다. 이미 수료한 직원은 이력 보존을 위해 제외되지 않습니다.</p><div class="target-scroll" style="max-height:300px">${data.employees.filter(e=>e.plant===c.plant||c.plant==='전체').map(e=>`<label class="check-row"><input type="checkbox" name="manualTarget" value="${esc(e.id)}" ${on.has(e.id)?'checked':''}/> ${esc(e.name)} · ${esc(e.dept)} · ${esc(e.empNo||'사번 없음')} ${e.employmentStatus==='퇴사'?'(퇴사)':''}</label>`).join('')}</div>`,`<button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="save-targets">대상자 저장</button>`)}
function saveTargets(){let c=course(),ids=new Set([...document.querySelectorAll('input[name="manualTarget"]:checked')].map(x=>x.value));const today=new Date().toLocaleDateString('sv-SE');for(const e of data.employees.filter(e=>e.plant===c.plant||c.plant==='전체')){let found=c.enrollments.find(x=>x.employeeId===e.id);let completed=complete(c,peek(c.id,e.id));if(ids.has(e.id)){if(found)found.active=true;else c.enrollments.push({employeeId:e.id,assignedAt:today,source:'관리자 직접 배정',active:true})}else if(found&&!completed){found.active=false}}save();closeModal();render();toast('교육별 대상자 지정이 저장됐습니다. 기존 수료이력은 보존됩니다.')}
function assignExisting(){let c=course();if(!c?.continuous)return toast('상시교육에서만 수동 배정할 수 있습니다.');let candidates=data.employees.filter(e=>e.employmentStatus!=='퇴사'&&!c.enrollments.some(x=>x.employeeId===e.id));if(!candidates.length)return toast('추가로 배정할 직원이 없습니다.');modal('상시교육 대상자 수동 배정',`<p class="small">기존 재직자도 이 과정에 추가할 수 있습니다. 신규 입사자는 직원 등록 시 자동 배정됩니다.</p><div class="field"><label>배정 직원</label><select id="existingStaff">${candidates.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} · ${esc(e.empNo||'사번 없음')} · ${esc(e.dept)}</option>`).join('')}</select></div>`,`<button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="assign-employee">교육 대상에 추가</button>`)}
function confirmAssign(){let c=course(),id=$('#existingStaff')?.value,e=data.employees.find(x=>x.id===id);if(!e)return toast('직원을 선택해 주세요.');addEnrollment(c,e,'관리자 수동배정');save();closeModal();render();toast(`${e.name}님을 상시교육 대상자로 배정했습니다.`)}
function handleAction(target){let action=target.dataset.action;let c=course();if(action==='create')return courseForm();if(action==='manage-targets')return manageTargets();if(action==='save-targets')return saveTargets();if(action==='assign-existing')return assignExisting();if(action==='assign-employee')return confirmAssign();if(action==='edit')return courseForm(true);if(action==='close-modal')return closeModal();if(action==='add-video'){let url=$('#newVideoUrl')?.value.trim(),id=videoId(url);if(!id)return toast('올바른 유튜브 주소를 입력해 주세요.');c.videos.push({id:uid('v'),url,title:$('#newVideoTitle')?.value.trim()||'교육영상 '+(c.videos.length+1)});if(!c.minWatchMinutes)c.minWatchMinutes=Math.min(60,Math.max(1,c.duration||60));save();render();toast('유튜브 링크를 등록했습니다. 최소 시청시간도 확인해 주세요.');return}if(action==='remove-video'){if(!confirm('이 유튜브 영상을 삭제할까요?'))return;c.videos=c.videos.filter(v=>v.id!==target.dataset.id);save();render();return}if(action==='remove-material'){if(!confirm('교육자료를 삭제할까요?'))return;c.materials=c.materials.filter(m=>m.id!==target.dataset.id);save();render();return}if(action==='view-material'){let m=c.materials.find(x=>x.id===target.dataset.id);if(m)showMaterial(m);return}if(action==='ack-material'){if(state.role==='employee'){let r=record();if(!r.materialIds.includes(target.dataset.id))r.materialIds.push(target.dataset.id);save()}closeModal();render();return}if(action==='to-records'||action==='view-records')return setPage('records');if(action==='to-learn')return setPage('learn');if(action==='export')return exportCsv();if(action==='print')return printReport();if(action==='print-cert-completed')return printCertificates(false);if(action==='print-cert-all')return printCertificates(true);if(action==='change-user')return showUserSwitch();if(action==='confirm-user')return confirmUser();if(action==='open-video'){let v=c.videos.find(x=>x.id===target.dataset.id);if(v)window.open('https://www.youtube.com/watch?v='+videoId(v.url),'_blank','noopener');return}if(action==='delete-course'){if(!confirm('교육과 관련된 이 브라우저의 기록을 함께 삭제할까요?'))return;data.courses=data.courses.filter(x=>x.id!==c.id);Object.keys(data.records).filter(k=>k.startsWith(c.id+'__')).forEach(k=>delete data.records[k]);state.courseId=data.courses[0]?.id||null;save();render();return}if(action==='submit-course')return submitCourse(target.dataset.edit==='yes');if(action==='to-quiz')return setPage('quiz');if(action==='save-quiz-settings')return saveQuizSettings();if(action==='add-question')return quizEditor(null);if(action==='edit-question')return quizEditor(target.dataset.id);if(action==='save-question')return saveQuestion(target.dataset.id||null);if(action==='copy-question'){let it=c.quiz.questions.find(x=>x.id===target.dataset.id);if(it){c.quiz.questions.push({...structuredClone(it),id:uid('q'),question:it.question+' (복사본)'});c.quiz.published=false;c.quiz.version++;save();render()}return}if(action==='delete-question'){if(!confirm('문제를 삭제할까? 기존 응시기록은 보존돼.'))return;c.quiz.questions=c.quiz.questions.filter(x=>x.id!==target.dataset.id);c.quiz.questionCount=Math.min(c.quiz.questionCount,Math.max(1,c.quiz.questions.length));c.quiz.published=false;c.quiz.version++;save();render();return}if(action==='suggest-questions')return addSuggested();if(action==='export-quiz')return csvDownload('FCT_평가문제_'+c.id+'_VER2_REV4.csv',[['문제 유형','문제 내용','보기1','보기2','보기3','보기4','보기5','정답 보기번호','해설'],...c.quiz.questions.map(it=>[it.type==='ox'?'OX':'객관식',it.question,...Array.from({length:5},(_,i)=>it.choices[i]||''),it.answer+1,it.explanation||''])]);if(action==='add-employee')return staffEditor(null);if(action==='edit-employee')return staffEditor(target.dataset.id);if(action==='save-employee')return saveEmployee(target.dataset.id||null);if(action==='remove-employee'){let e=data.employees.find(x=>x.id===target.dataset.id);if(e){e.employmentStatus='퇴사';save();render();toast('퇴사 처리했습니다. 교육이력은 보관됩니다.')}return}if(action==='template-staff')return csvDownload('FCT_직원등록_양식_VER2_REV4.csv',[['사번','성명','부서','공장','입사일','재직상태'],['F009','신규직원예시','전반','2공장','2026-11-09','재직']]);if(action==='export-staff')return csvDownload('FCT_직원명부_VER2_REV4.csv',[['사번','성명','부서','공장','입사일','재직상태'],...data.employees.map(e=>[e.empNo||'',e.name,e.dept,e.plant,e.hireDate||'',e.employmentStatus||'재직'])]);if(action==='quiz-submit')return gradeExam();if(action==='clear-sign'){attachSignature();return}if(action==='sign')return saveSignature();if(action==='demo-unlock'){if(!confirm('체험용 서명을 활성화할까요? 이 기록은 실제 교육 이수증빙으로 사용할 수 없습니다.'))return;let r=record();r.demo=true;save();toast('체험용 서명이 활성화됐습니다. 손가락으로 서명하고 제출해 보세요.');return}if(action==='view-sign'){let e=data.employees.find(x=>x.id===target.dataset.id);let r=peek(c.id,e.id);if(r.signature)modal(e.name+' 전자서명',`<img src="${r.signature}" alt="서명" style="width:100%;height:180px;object-fit:contain;border:1px solid #e1ecef;border-radius:9px"/><p class="small">서명시각 : ${esc(r.signedAt)}</p><p class="small">${r.demo?'체험기록 — 법정교육 증빙 불가':'이 브라우저의 시연 기록'}</p>`);return}}
async function submitCourse(edit){let form=$('#courseEditor');if(!form?.reportValidity())return;let f=new FormData(form),title=String(f.get('title')||'').trim();if(!title)return toast('교육명을 입력해 주세요.');let links=String(f.get('links')||'').trim().split(/\n/).map(x=>x.trim()).filter(Boolean);if(links.some(x=>!videoId(x)))return toast('유튜브 주소 중 올바르지 않은 링크가 있습니다.');let obj=edit?course():{id:uid('c'),videos:[],materials:[],quiz:{questions:safetyExamples.slice(0,5).map(ex=>({id:uid('q'),type:ex.type||'multiple',question:ex.question,choices:[...ex.choices],answer:ex.answer,explanation:ex.explanation})),passingScore:80,questionCount:5,attemptLimit:3,shuffle:true,published:false,version:1}};let targetMode=String(f.get('targetMode')||'전체'),targetDepts=f.getAll('targetDepts').map(String),targetIds=f.getAll('targetIds').map(String);if(targetMode==='부서별'&&!targetDepts.length)return toast('대상 부서를 하나 이상 선택해 주세요.');if(targetMode==='개인별'&&!targetIds.length)return toast('대상자를 한 명 이상 선택해 주세요.');let chosenDept=targetMode==='전체'?'전체':targetMode==='부서별'?targetDepts.join(', '):'개인 지정';Object.assign(obj,{title,type:String(f.get('type')),plant:String(f.get('plant')),dept:chosenDept,targetMode,targetDepts,targetIds,date:String(f.get('actualDate')||String(f.get('educationMonth'))+'-01'),educationMonth:String(f.get('educationMonth')),actualDate:String(f.get('actualDate')||''),duration:parseInt(f.get('duration'))||60,minWatchMinutes:Math.max(0,Math.round(Number(f.get('minWatchMinutes'))||0)),description:String(f.get('description')||''),continuous:f.get('continuous')==='yes'});if(!Array.isArray(obj.enrollments))obj.enrollments=[];let eligible=data.employees.filter(e=>e.employmentStatus!=='퇴사'&&qualifies(obj,e));if(edit){let allow=new Set(eligible.map(e=>e.id));for(const en of obj.enrollments){if(allow.has(en.employeeId))en.active=true;else if(!complete(obj,peek(obj.id,en.employeeId)))en.active=false}for(let e of eligible){if(!obj.enrollments.some(en=>en.employeeId===e.id))obj.enrollments.push({employeeId:e.id,assignedAt:obj.date,source:'관리자 대상 수정',active:true})}}else{obj.enrollments=eligible.map(e=>({employeeId:e.id,assignedAt:obj.date,source:'교육 등록 시 배정',active:true}));obj.videos=links.map((url,i)=>({id:uid('v'),url,title:'교육영상 '+(i+1)}));data.courses.unshift(obj)}state.courseId=obj.id;let files=f.getAll('files').filter(x=>x instanceof File&&x.size>0);if(files.some(x=>x.size>1.5*1024*1024))return toast('교육자료는 파일당 1.5MB 이내로 등록해 주세요.');for(let file of files){try{obj.materials.push(await fileData(file))}catch(e){}}save();closeModal();render();toast(edit?'교육 정보가 수정됐습니다.':'교육이 등록됐습니다.')}
 document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){setPage(nav.dataset.nav);return}let role=e.target.closest('[data-role]');if(role){setPage(role.dataset.role==='employee'?'learn':'overview');return}let cbtn=e.target.closest('[data-course]');if(cbtn){stopPlayer();state.courseId=cbtn.dataset.course;render();return}let play=e.target.closest('[data-play-video]');if(play){stopPlayer();state.activeVideo=Number(play.dataset.playVideo);render();return}let action=e.target.closest('[data-action]');if(action){e.preventDefault();handleAction(action);return}let mine=e.target.closest('[data-learn-course]');if(mine){stopPlayer();state.courseId=mine.dataset.learnCourse;state.activeVideo=0;state.quizAnswers={};render();return}if(e.target.id==='modalBackdrop')closeModal()});
 document.addEventListener('change',e=>{if(e.target.name==='targetMode'){let v=e.target.value;let d=$('#targetDeptBox'),p=$('#targetPeopleBox');if(d)d.style.display=v==='부서별'?'':'none';if(p)p.style.display=v==='개인별'?'':'none';return}if(e.target.id==='recordSearch'){state.recordSearch=e.target.value.trim();render();return}if(e.target.id==='adminFiles'){addFiles(e.target.files,course());return}if(e.target.id==='employeeSelect'){stopPlayer();state.employeeId=e.target.value;state.quizAnswers={};render();return}if(e.target.id==='learnCourse'||e.target.id==='recordsCourse'){stopPlayer();state.courseId=e.target.value;state.activeVideo=0;state.quizAnswers={};render();return}if(e.target.id==='recordPeriod'){state.recordPeriod=e.target.value;render();return}if(e.target.id==='recordFilter'){state.recordFilter=e.target.value;render();return}if(e.target.id==='recordDept'){state.recordDept=e.target.value;render();return}if(e.target.id==='staffCsv'){importStaff(e.target.files?.[0]);return}if(e.target.id==='editorType'){let box=$('#editorOptions');if(box)box.innerHTML=editorOptions(e.target.value==='ox'?['O','X']:['','','',''],e.target.value,0);return}if(e.target.name?.startsWith('exam_')){state.quizAnswers[e.target.name.slice(5)]=Number(e.target.value);return}});
 render();
