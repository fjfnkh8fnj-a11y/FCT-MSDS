<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#112b38">
  <meta name="description" content="FCT 교육관리 - 직원별 교육배정, 이수현황, 전자서명, 교육일지 및 백업">
  <title>FCT 교육관리 VER3 rev.2</title>
  <link rel="stylesheet" href="./styles_rev.1.css">
</head>
<body>
  <header class="topbar">
    <div class="topbrand"><span class="mark">FCT</span><div><b>교육관리</b><small>EDUCATION MANAGEMENT · VER3 rev.2</small></div></div>
    <div class="account" id="accountArea"><span class="chip">NEON CLOUD</span></div>
  </header>
  <div class="loading" id="loading">교육관리 서버 연결 중...</div>
  <main class="auth-wrap" id="authArea" hidden>
    <section class="auth-card">
      <div class="auth-heading"><h1>FCT 교육관리</h1><p>1공장 · 2공장 직원 교육 이수 및 기록 관리</p></div>
      <div class="auth-switch" role="tablist"><button class="active" id="tabLogin" type="button">직원 로그인</button><button id="tabRegister" type="button">최초 등록·비밀번호 초기화</button><button id="tabAdmin" type="button">관리자 최초 설정</button></div>
      <form id="formLogin" class="stack">
        <label>사번 또는 관리자 이메일<input id="loginId" autocomplete="username" required placeholder="사번 입력"></label>
        <label>비밀번호<input id="loginPw" type="password" autocomplete="current-password" required placeholder="본인이 설정한 비밀번호"></label>
        <button class="primary" type="submit">로그인</button>
        <p class="note">비밀번호를 잊었으면 관리자에게 초기화를 요청하세요.</p>
      </form>
      <form id="formRegister" class="stack" hidden>
        <p class="notice">관리자가 직원 명부를 등록하면 사번별 발급코드를 전달받습니다. 초기화 PIN은 <b>1111</b>이며, 실제 로그인 비밀번호는 여기서 새로 설정합니다.</p>
        <label>사번<input id="registerId" required placeholder="사번"></label>
        <label>초기화 PIN<input id="registerPin" type="password" inputMode="numeric" required placeholder="1111"></label>
        <label>직원별 1회 발급코드<input id="registerInvite" required placeholder="관리자에게 받은 발급코드"></label>
        <label>새 비밀번호 (8자 이상)<input id="registerPw" type="password" minlength="8" required placeholder="직접 설정"></label>
        <button class="primary" type="submit">계정 활성화</button>
      </form>
      <form id="formAdmin" class="stack" hidden>
        <p class="notice">최초 한 번만 설정합니다. 운영 관리자 이메일과 8자 이상 비밀번호를 직접 정하세요. 관리자 초기 설정 코드는 별도로 전달한 1회 코드입니다.</p>
        <label>관리자 성명<input id="adminName" required placeholder="관리자"></label>
        <label>관리자 이메일<input id="adminEmail" type="email" autocomplete="email" required placeholder="본인 이메일"></label>
        <label>관리자 로그인 비밀번호<input id="adminPw" type="password" minlength="8" required></label>
        <label>최초 설정 코드<input id="adminCode" type="password" required></label>
        <button class="primary" type="submit">관리자 계정 생성</button>
      </form>
    </section>
  </main>
  <div id="workspace" class="workspace" hidden>
    <aside id="nav" class="nav"></aside>
    <main id="main" class="main"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"><div id="dialogBody"></div><form method="dialog" class="modal-footer"><button class="secondary">닫기</button></form></dialog>
  <script type="module" src="./app_rev.2.js"></script>
</body>
</html>
